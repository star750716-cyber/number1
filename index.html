<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專屬號碼牌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        
        /* 系統錯誤提示區 */
        #error-log { display: none; background: #fee2e2; color: #991b1b; padding: 1rem; margin: 1rem; border-radius: 0.5rem; font-size: 0.875rem; word-break: break-all; }

        /* 票券樣式 */
        .ticket-divider { position: relative; }
        .ticket-divider::before, .ticket-divider::after {
            content: ''; position: absolute; top: 50%; width: 24px; height: 24px; background-color: #f3f4f6;
            border-radius: 50%; transform: translateY(-50%); box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }
        .ticket-divider::before { left: -12px; }
        .ticket-divider::after { right: -12px; }

        .stamp {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg) scale(0);
            border: 4px solid #ef4444; color: #ef4444; font-size: 2rem; font-weight: 900; padding: 0.5rem 2rem;
            border-radius: 0.5rem; opacity: 0; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 10;
        }
        .stamp.show { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 0.9; }

        .bg-gradient-animate {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); background-size: 200% 200%; animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 防偽時鐘 */
        .blink-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- 全域錯誤顯示器 (除錯用) -->
    <div id="error-log" class="fixed top-0 left-0 w-full z-[100] shadow-md"></div>

    <!-- 狀態 1：載入中 -->
    <div id="loading-view" class="w-full max-w-sm text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
        <p class="text-gray-500 font-medium">系統連線中，請稍候...</p>
    </div>

    <!-- 狀態 2：無效連結 (防分享畫面) -->
    <div id="invalid-view" class="w-full max-w-sm text-center hidden">
        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">無效的連結</h2>
        <p class="text-gray-500">此號碼牌連結已失效，或您並未在現場掃描。<br>請至現場掃描最新的 QR Code 領取號碼。</p>
    </div>

    <!-- 狀態 3：店家主控台 (需帶有 ?role=admin 才會顯示) -->
    <div id="admin-view" class="w-full max-w-md bg-gray-900 rounded-3xl shadow-2xl overflow-hidden hidden">
        <div class="p-6 text-center text-white border-b border-gray-800">
            <h1 class="text-2xl font-bold">發號主控台</h1>
            <p id="admin-date" class="text-gray-400 text-sm mt-1">載入中...</p>
        </div>
        <div class="p-8 flex flex-col items-center">
            <div class="bg-white p-4 rounded-xl shadow-lg mb-6">
                <div id="qrcode"></div>
            </div>
            <p class="text-yellow-400 font-bold mb-8">▲ 請讓顧客掃描上方條碼 ▲</p>
            
            <div class="grid grid-cols-2 gap-4 w-full mb-8">
                <div class="bg-gray-800 p-4 rounded-xl text-center">
                    <p class="text-gray-400 text-sm">今日已發放</p>
                    <p id="admin-issued" class="text-4xl font-black text-white mt-1">0</p>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl text-center">
                    <p class="text-gray-400 text-sm">已兌換數量</p>
                    <p id="admin-redeemed" class="text-4xl font-black text-green-400 mt-1">0</p>
                </div>
            </div>

            <button onclick="showResetConfirm()" class="w-full py-4 rounded-xl font-bold text-red-400 bg-red-400/10 hover:bg-red-400/20 transition-colors border border-red-400/20">
                清除今日數據並歸零
            </button>
        </div>
    </div>

    <!-- 狀態 4：顧客票券畫面 -->
    <main id="ticket-view" class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden hidden relative">
        <div class="bg-gradient-animate text-white text-center py-6 px-4">
            <h1 class="text-xl font-bold tracking-wider">專屬號碼牌</h1>
            <p class="text-sm opacity-90 mt-1">憑此畫面至櫃台兌換</p>
        </div>

        <div class="p-8 text-center relative overflow-hidden">
            <div id="redeemed-stamp" class="stamp">已兌換</div>
            <p class="text-gray-500 text-sm font-medium mb-2">您的專屬號碼</p>
            <div class="flex items-center justify-center">
                <span class="text-2xl font-bold text-gray-400 mr-2">No.</span>
                <span id="ticket-number" class="text-6xl font-black text-gray-800 tracking-tighter">---</span>
            </div>
            
            <!-- 取號時間 -->
            <div class="mt-6 flex flex-col items-center justify-center text-gray-600 bg-gray-50 py-3 px-4 rounded-lg">
                <div class="flex items-center text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span id="ticket-date">YYYY/MM/DD</span>
                </div>
                <div class="text-lg font-bold mt-1 tracking-wider" id="ticket-time">HH:mm</div>
            </div>

            <!-- 防偽時鐘 -->
            <div class="mt-4 inline-flex items-center justify-center bg-green-50 text-green-700 px-3 py-1.5 rounded-full border border-green-200">
                <div class="w-2 h-2 bg-green-500 rounded-full mr-2 blink-dot"></div>
                <span class="text-xs font-bold">目前時間：<span id="realtime-clock" class="font-mono">--:--:--</span></span>
            </div>

            <!-- 即時兌換進度顯示 -->
            <div class="mt-3 block">
                <div class="inline-flex items-center justify-center bg-blue-50 text-blue-700 px-4 py-1.5 rounded-full border border-blue-200">
                    <span class="text-xs font-bold">目前已兌換至：<span class="text-sm font-black ml-1">No.<span id="ticket-current-redeemed">000</span></span></span>
                </div>
            </div>
        </div>

        <div class="ticket-divider h-8 relative flex items-center">
            <div class="w-full border-t-2 border-dashed border-gray-200 mx-4"></div>
        </div>

        <div class="p-6 pt-2 pb-8">
            <button id="main-btn" class="w-full py-4 rounded-xl font-bold text-lg text-white transition-all transform flex justify-center items-center">
                <span id="btn-text">讀取中...</span>
            </button>
            <p class="text-xs text-center text-gray-400 mt-4">⚠️ 兌換操作請交由工作人員執行</p>
        </div>
    </main>

    <!-- 自訂 Modal (確認視窗) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 text-center transform scale-95 transition-transform duration-200" id="modal-box">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">標題</h3>
            <p id="modal-desc" class="text-gray-500 text-sm mb-6">敘述</p>
            <div class="flex space-x-3">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 active:bg-gray-200">取消</button>
                <button id="modal-confirm-btn" class="flex-1 py-3 rounded-xl font-bold text-white bg-blue-500 active:bg-blue-600">確認</button>
            </div>
        </div>
    </div>

    <!-- 自訂 Message Modal (單一按鈕提示) -->
    <div id="msg-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 text-center transform scale-95 transition-transform duration-200" id="msg-modal-box">
            <h3 id="msg-title" class="text-xl font-bold text-gray-800 mb-2">標題</h3>
            <p id="msg-desc" class="text-gray-500 text-sm mb-6">敘述</p>
            <button onclick="closeMsgModal()" class="w-full py-3 rounded-xl font-bold text-white bg-blue-500 active:bg-blue-600">我知道了</button>
        </div>
    </div>

    <script type="module">
        // 捕捉未預期的錯誤，顯示在畫面上防止白畫面
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errBox = document.getElementById('error-log');
            errBox.style.display = 'block';
            errBox.innerHTML += `<div>❌ Error: ${msg}</div>`;
            return false;
        };
        window.addEventListener("unhandledrejection", function(event) {
            const errBox = document.getElementById('error-log');
            errBox.style.display = 'block';
            errBox.innerHTML += `<div>❌ Promise Error: ${event.reason}</div>`;
        });

        // 載入 Firebase 模組 (使用相容性高的 10.12.2 版本)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 您的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAUlLgYZxGn1hvJtDM9QPnXiSeTGHCeJtk",
            authDomain: "number-d4ecd.firebaseapp.com",
            projectId: "number-d4ecd",
            storageBucket: "number-d4ecd.firebasestorage.app",
            messagingSenderId: "304123026188",
            appId: "1:304123026188:web:0ae5e2d2d4939430820729",
            measurementId: "G-6GCPX0LTCL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 系統變數
        let todayDateStr = "";
        let docRef = null;
        let qrCodeObj = null;

        // UI 切換函數
        const views = ['loading-view', 'invalid-view', 'admin-view', 'ticket-view'];
        function showView(viewId) {
            views.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        // Modal 相關函數
        window.closeModal = () => {
            document.getElementById('custom-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-box').classList.replace('scale-100', 'scale-95');
        };
        function openModal(title, desc, confirmText, confirmColor, confirmCallback) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            const btn = document.getElementById('modal-confirm-btn');
            btn.textContent = confirmText;
            btn.className = `flex-1 py-3 rounded-xl font-bold text-white shadow-md ${confirmColor}`;
            btn.onclick = () => { confirmCallback(); window.closeModal(); };
            
            document.getElementById('custom-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-box').classList.replace('scale-95', 'scale-100');
        }

        window.closeMsgModal = () => {
            document.getElementById('msg-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('msg-modal-box').classList.replace('scale-100', 'scale-95');
        };
        function showMsg(title, desc) {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-desc').textContent = desc;
            document.getElementById('msg-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('msg-modal-box').classList.replace('scale-95', 'scale-100');
        }

        // 取得 YYYYMMDD
        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        }
        
        // 日期時間格式化
        function formatDateTime(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth()+1).padStart(2,'0');
            const d = String(dateObj.getDate()).padStart(2,'0');
            const h = String(dateObj.getHours()).padStart(2,'0');
            const min = String(dateObj.getMinutes()).padStart(2,'0');
            return { date: `${y}/${m}/${d}`, time: `${h}:${min}` };
        }

        // 更新防偽時鐘
        setInterval(() => {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2,'0') + ":" + 
                            String(now.getMinutes()).padStart(2,'0') + ":" + 
                            String(now.getSeconds()).padStart(2,'0');
            const clockEl = document.getElementById('realtime-clock');
            if(clockEl) clockEl.textContent = timeStr;
        }, 1000);

        // 主程式啟動
        async function bootApp() {
            try {
                // 1. 登入 Firebase
                await signInAnonymously(auth);
                todayDateStr = getTodayStr();
                docRef = doc(db, "daily_tickets", todayDateStr);

                // 確認資料庫文件存在，不存在則建立
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    await setDoc(docRef, { issued: 0, redeemed: 0 });
                }

                // 2. 路由判斷
                const urlParams = new URLSearchParams(window.location.search);
                const role = urlParams.get('role');
                const action = urlParams.get('action');

                if (role === 'admin') {
                    initAdminMode();
                } else if (action === 'scan') {
                    // 清除網址參數防分享
                    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    window.history.replaceState({}, document.title, cleanUrl);
                    initCustomerMode(true);
                } else {
                    initCustomerMode(false);
                }
            } catch (err) {
                console.error("Boot Error:", err);
                throw err; // 將錯誤拋給 window.onerror 顯示
            }
        }

        // --- 店家主控台模式 ---
        function initAdminMode() {
            showView('admin-view');
            
            const y = todayDateStr.substring(0,4);
            const m = todayDateStr.substring(4,6);
            const d = todayDateStr.substring(6,8);
            document.getElementById('admin-date').textContent = `${y}/${m}/${d}`;

            // 生成 QR Code (帶有 ?action=scan)
            const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            const targetUrl = baseUrl + "?action=scan";
            
            qrCodeObj = new QRCode(document.getElementById("qrcode"), {
                text: targetUrl,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });

            // 監聽數據變化
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('admin-issued').textContent = data.issued || 0;
                    document.getElementById('admin-redeemed').textContent = data.redeemed || 0;
                }
            });
        }

        // 店家歸零
        window.showResetConfirm = () => {
            openModal('警告：強制歸零', '確定要將今日所有發放紀錄歸零嗎？這會讓顧客已拿到的號碼作廢。', '確定歸零', 'bg-red-500 hover:bg-red-600', async () => {
                await setDoc(docRef, { issued: 0, redeemed: 0 });
                showMsg('成功', '號碼已全數歸零，從 1 號重新開始。');
            });
        };

        // --- 顧客抽號與票券模式 ---
        async function initCustomerMode(isNewScan) {
            const localKey = 'myQRCodeTicket_' + todayDateStr;
            let ticketData = JSON.parse(localStorage.getItem(localKey));

            if (isNewScan) {
                if (!ticketData) {
                    // 新掃描且沒號碼 -> 取號
                    showView('loading-view');
                    try {
                        const newNumber = await fetchNewNumber();
                        const now = new Date();
                        const dt = formatDateTime(now);
                        ticketData = {
                            number: String(newNumber).padStart(3, '0'),
                            date: dt.date,
                            time: dt.time,
                            isRedeemed: false
                        };
                        localStorage.setItem(localKey, JSON.stringify(ticketData));
                        renderTicketUI(ticketData);
                        showView('ticket-view');
                    } catch (e) {
                        showMsg('錯誤', '系統繁忙中，請重新掃描。');
                        showView('invalid-view');
                    }
                } else {
                    // 已經有號碼又掃描 -> 顯示原號碼
                    renderTicketUI(ticketData);
                    showView('ticket-view');
                }
            } else {
                // 直接貼網址進來 (無參數)
                if (ticketData) {
                    // 本地有憑證 -> 顯示票券
                    renderTicketUI(ticketData);
                    showView('ticket-view');
                } else {
                    // 沒憑證又沒掃描 -> 阻擋
                    showView('invalid-view');
                }
            }

            // 監聽雲端數據變化 (歸零作廢 與 即時兌換進度)
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    const currentIssued = data.issued || 0;
                    const currentRedeemed = data.redeemed || 0;

                    // 🌟 更新客端畫面上的「目前兌換進度」
                    const redeemedEl = document.getElementById('ticket-current-redeemed');
                    if(redeemedEl) {
                        redeemedEl.textContent = String(currentRedeemed).padStart(3, '0');
                    }

                    ticketData = JSON.parse(localStorage.getItem(localKey));
                    // 若店家歸零了，目前客人的號碼大於發放量，代表號碼已失效
                    if (ticketData && parseInt(ticketData.number) > currentIssued) {
                        localStorage.removeItem(localKey);
                        showView('invalid-view');
                        showMsg('號碼已重置', '店家已重置今日號碼牌系統，請重新掃描取號。');
                    }
                }
            });
        }

        // 取號 Transaction
        async function fetchNewNumber() {
            let newNumber = 0;
            await runTransaction(db, async (transaction) => {
                const docSnap = await transaction.get(docRef);
                if (!docSnap.exists()) {
                    newNumber = 1;
                    transaction.set(docRef, { issued: 1, redeemed: 0 });
                } else {
                    const data = docSnap.data();
                    newNumber = (data.issued || 0) + 1;
                    transaction.update(docRef, { issued: newNumber });
                }
            });
            return newNumber;
        }

        // 渲染票券UI
        function renderTicketUI(data) {
            document.getElementById('ticket-number').textContent = data.number;
            document.getElementById('ticket-date').textContent = data.date;
            document.getElementById('ticket-time').textContent = data.time;
            
            const btn = document.getElementById('main-btn');
            const btnText = document.getElementById('btn-text');
            const stamp = document.getElementById('redeemed-stamp');

            if (data.isRedeemed) {
                btn.className = "w-full py-4 rounded-xl font-bold text-lg text-gray-500 bg-gray-200 cursor-not-allowed flex justify-center items-center";
                btnText.innerHTML = `已兌換完畢`;
                document.getElementById('ticket-number').classList.add('text-gray-300');
                stamp.classList.add('show');
                btn.onclick = null;
            } else {
                btn.className = "w-full py-4 rounded-xl font-bold text-lg text-white bg-blue-500 shadow-blue-500/30 shadow-lg hover:bg-blue-600 active:scale-95 flex justify-center items-center cursor-pointer";
                btnText.textContent = "由工作人員點擊兌換";
                document.getElementById('ticket-number').classList.remove('text-gray-300');
                stamp.classList.remove('show');
                btn.onclick = () => {
                    openModal('確認兌換？', '點擊後將無法還原，請確認是否由工作人員操作。', '確認兌換', 'bg-blue-500 hover:bg-blue-600', executeRedeem);
                };
            }
        }

        // 執行兌換
        async function executeRedeem() {
            const localKey = 'myQRCodeTicket_' + todayDateStr;
            let ticketData = JSON.parse(localStorage.getItem(localKey));
            
            if (ticketData && !ticketData.isRedeemed) {
                // 更新雲端數字 (加鎖避免衝突)
                try {
                    await runTransaction(db, async (transaction) => {
                        const docSnap = await transaction.get(docRef);
                        const currentRedeemed = docSnap.exists() ? (docSnap.data().redeemed || 0) : 0;
                        transaction.update(docRef, { redeemed: currentRedeemed + 1 });
                    });
                } catch(e) {
                    console.error("Redeem failed: ", e);
                }

                // 更新本地
                ticketData.isRedeemed = true;
                localStorage.setItem(localKey, JSON.stringify(ticketData));
                renderTicketUI(ticketData);
            }
        }

        // 啟動
        document.addEventListener('DOMContentLoaded', bootApp);
    </script>
</body>
</html>
